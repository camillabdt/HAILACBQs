[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haila-backend"
version = "1.0.0"
description = "Backend da arquitetura HAILA"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "openai>=1.40",
  "pydantic>=2.8",
]

[project.optional-dependencies]
slm = ["torch>=2.2", "transformers>=4.44", "peft>=0.12", "accelerate>=0.33"]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
haila = "haila.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
